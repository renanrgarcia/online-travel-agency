name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore backend/FlightAi.slnx

      - name: Build
        run: dotnet build backend/FlightAi.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test backend/FlightAi.slnx --no-build --configuration Release

  # Separate from build-and-test above (different toolchain, different working directory) -- its own
  # name so branch protection can require it independently, same reasoning as splitting deploy from
  # deploy-functions below.
  build-and-test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # Only fires on a push to main -- develop and PR runs stop at build-and-test. Nothing lands on main
  # without build-and-test having already passed on it, since branch protection requires that check.
  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: >
          dotnet publish backend/src/FlightAi.Api/FlightAi.Api.csproj
          --configuration Release
          --output ./publish

      # Fill in `app-name` with the Web App name from infra/main.bicepparam's environmentName
      # (flightai-api-<environmentName>) once it's actually deployed. AZURE_WEBAPP_PUBLISH_PROFILE is a
      # repo secret (Settings -> Secrets and variables -> Actions) holding the publish profile XML,
      # downloadable from the Web App's Overview blade in the Azure Portal once it exists.
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: flightai-api-dev
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish

  # Separate job, not a step in `deploy` above -- both only need build-and-test, neither depends on the
  # other, so they run in parallel and a failure in one doesn't block or hide the other's result.
  deploy-functions:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: >
          dotnet publish backend/src/FlightAi.Booking.Functions/FlightAi.Booking.Functions.csproj
          --configuration Release
          --output ./publish-functions

      # Fill in `app-name` with the Function App name from infra/main.bicepparam's environmentName
      # (flightai-booking-<environmentName>) once it's actually deployed. AZURE_FUNCTIONAPP_PUBLISH_PROFILE
      # is a separate repo secret from the Web App's -- the Function App is a different resource with its
      # own publish profile, downloadable from its own Overview blade once it exists.
      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: flightai-booking-dev
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          package: ./publish-functions

  # Depends on build-and-test-frontend specifically, not the backend build-and-test -- same
  # one-CI-job-feeds-one-deploy-job pattern as deploy/deploy-functions above.
  deploy-frontend:
    needs: build-and-test-frontend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Azure/static-web-apps-deploy action builds internally (Oryx), given app_location and
      # output_location -- no separate npm ci/build step needed here, unlike the backend jobs' explicit
      # dotnet publish. VITE_API_BASE_URL and VITE_BOOKING_API_BASE_URL are Vite's build-time env var
      # convention: frontend code reads them via `import.meta.env.VITE_*` (frontend/src/config.ts --
      # task F03's integration point for the API, F05's for booking). The booking one must be named
      # exactly VITE_BOOKING_API_BASE_URL, matching config.ts's own getBookingApiBaseUrl() -- a prior
      # mismatch here (VITE_FUNCTIONS_BASE_URL) silently made every deployed booking call fall back to
      # the SWA's own same-origin default instead of the Function App, found via a live infra-lane
      # validation pass, not caught by any test since the name itself was never exercised. The browser
      # calls the Function App directly for the booking saga, per docs/reference/07-booking-saga.md, not
      # through the API.
      #
      # Values come from repo variables (Settings -> Secrets and variables -> Actions -> Variables), not
      # hardcoded here -- infra/main.bicep already outputs both URLs (webAppUrl, functionAppUrl), so
      # typing them a second time in this file would just be a second source of truth free to drift the
      # moment either app is renamed. Set/update after any infra deploy that changes them:
      #   az deployment sub show --name flightai-dev --query "properties.outputs.{api:webAppUrl.value, functions:functionAppUrl.value}"
      #   gh variable set API_BASE_URL --body "<api>"
      #   gh variable set FUNCTIONS_BASE_URL --body "<functions>"
      #
      # Fill in azure_static_web_apps_api_token with a repo secret once the Static Web App is deployed --
      # NOT a publish profile like the other two jobs. Static Web Apps authenticates deployments with its
      # own dedicated deployment token, retrieved with:
      #   az staticwebapp secrets list --name flightai-web-dev --resource-group rg-flightai-dev --query properties.apiKey -o tsv
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "frontend"
          output_location: "dist"
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
          VITE_BOOKING_API_BASE_URL: ${{ vars.FUNCTIONS_BASE_URL }}
